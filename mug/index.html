<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>From Brazil to Northern Ireland — A tiny map with love</title>
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      :root{
        --fg:#0f172a; --muted:#475569; --bg:#f8fafc; --brand:#0ea5e9;
      }
      html, body { height:100%; margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; background: var(--bg); color: var(--fg);}      
      .wrap{ max-width:900px; margin:24px auto; padding: 16px; }
      h1{ font-size: clamp(18px, 3vw, 28px); margin: 0 0 8px;}
      p{ margin: 0 0 8px; color: var(--muted);}
      .card{ background:#fff; border-radius:16px; box-shadow: 0 6px 24px rgba(2,6,23,.08); padding: 14px; }
      #map{ height: 480px; border-radius:12px; }
      .row{ display:flex; gap:12px; flex-wrap: wrap; align-items: center; }
      .field{ display:flex; flex-direction: column; gap:6px; flex:1; min-width:240px; }
      label{ font-size:12px; color:#334155; letter-spacing:.02em; }
      input{ border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; font-size:14px; }
      .btns{ display:flex; gap:8px; flex-wrap: wrap; margin-top:8px; }
      button{ cursor:pointer; border:1px solid #0ea5e9; background:#0ea5e9; color:#fff; border-radius:10px; padding:10px 14px; font-weight:600; }
      button.secondary{ background:#fff; color:#0ea5e9; }
      .meta{ display:flex; gap:12px; flex-wrap: wrap; font-size:13px; color:#334155; margin-top:8px;}
      .pill{ background:#f1f5f9; padding:6px 10px; border-radius:999px; }
      footer{ text-align:center; font-size:12px; color:#64748b; margin:16px 0 32px; }
      a{ color: var(--brand); text-decoration: none; }
      a:hover{ text-decoration: underline; }
      @media (max-width: 600px){ #map{ height: 360px; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" style="margin-bottom:12px;">
        <h1>From <span id="fromLabel">São Paulo</span> to <span id="toLabel">Belfast</span></h1>
        <p id="msg">A little piece of home, now just a scan away.</p>
        <div class="meta" id="meta"></div>
      </div>
      <div id="map" class="card" aria-label="Map with origin and destination"></div>
      <div class="card" style="margin-top:12px;">
        <div class="row">
          <div class="field">
            <label>Origin (lat,lng)</label>
            <input id="from" value="-23.5505,-46.6333" />
          </div>
          <div class="field">
            <label>Destination (lat,lng)</label>
            <input id="to" value="54.5973,-5.9301" />
          </div>
          <div class="field">
            <label>Message</label>
            <input id="message" value="From Brazil to Northern Ireland — with love." />
          </div>
        </div>
        <div class="btns">
          <button id="update">Update map</button>
          <button id="share" class="secondary">Copy shareable URL</button>
        </div>
      </div>
      <footer>
        This page is static and privacy‑friendly. You can host it on GitHub Pages / Netlify / Vercel. The share URL includes only the coordinates and message.
      </footer>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
      // --- utilities ---
      const $ = (s)=>document.querySelector(s);
      const byId = (id)=>document.getElementById(id);
      const km = (m)=> (m/1000).toFixed(1);
      const haversine = (a,b)=>{ // meters
        const toRad = d=>d*Math.PI/180;
        const R = 6371e3;
        const dLat = toRad(b.lat-a.lat), dLng = toRad(b.lng-a.lng);
        const la1 = toRad(a.lat), la2 = toRad(b.lat);
        const sinDLat = Math.sin(dLat/2), sinDLng = Math.sin(dLng/2);
        const h = sinDLat*sinDLat + Math.cos(la1)*Math.cos(la2)*sinDLng*sinDLng;
        const c = 2*Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
        return R*c;
      }
      function fmtCoord({lat,lng}){ return `${lat.toFixed(4)}°, ${lng.toFixed(4)}°`; }
      function placeLabel({lat,lng}){
        // naive reverse labels for defaults; override via &fromName=&toName=
        const f = `${lat<0?Math.abs(lat).toFixed(2)+'°S':lat.toFixed(2)+'°N'}, ${lng<0?Math.abs(lng).toFixed(2)+'°W':lng.toFixed(2)+'°E'}`;
        return f;
      }
      function parseLatLng(str){
        const [la,ln] = String(str).split(',').map(s=>parseFloat(s.trim()));
        if(Number.isFinite(la) && Number.isFinite(ln)) return {lat:la, lng:ln};
        return null;
      }
      function getParams(){
        const p = new URLSearchParams(location.search);
        const from = parseLatLng(p.get('from')) || parseLatLng(byId('from').value);
        const to = parseLatLng(p.get('to')) || parseLatLng(byId('to').value);
        const message = p.get('msg') || byId('message').value;
        const fromName = p.get('fromName') || 'São Paulo';
        const toName = p.get('toName') || 'Belfast';
        return {from,to,message,fromName,toName};
      }
      function setParams({from,to,message,fromName,toName}){
        const p = new URLSearchParams();
        p.set('from', `${from.lat},${from.lng}`);
        p.set('to', `${to.lat},${to.lng}`);
        if(message) p.set('msg', message);
        if(fromName) p.set('fromName', fromName);
        if(toName) p.set('toName', toName);
        const url = `${location.origin}${location.pathname}?${p.toString()}`;
        history.replaceState(null,'',url);
        return url;
      }

      // --- map ---
      const map = L.map('map', { zoomControl: true });
      const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);
      const g = { line:null, fromMarker:null, toMarker:null };

      function render(){
        const {from,to,message,fromName,toName} = getParams();
        if(!from||!to) return;
        byId('from').value = `${from.lat},${from.lng}`;
        byId('to').value = `${to.lat},${to.lng}`;
        byId('message').value = message||'';
        byId('fromLabel').textContent = fromName || placeLabel(from);
        byId('toLabel').textContent = toName || placeLabel(to);
        byId('msg').textContent = message||'';

        if(g.line){ map.removeLayer(g.line); map.removeLayer(g.fromMarker); map.removeLayer(g.toMarker); }
        g.fromMarker = L.marker([from.lat, from.lng]).addTo(map).bindPopup(`<b>Origin</b><br>${fromName}<br>${fmtCoord(from)}`);
        g.toMarker = L.marker([to.lat, to.lng]).addTo(map).bindPopup(`<b>Destination</b><br>${toName}<br>${fmtCoord(to)}`);
        g.line = L.polyline([[from.lat, from.lng],[to.lat, to.lng]], {weight:4, opacity:0.7}).addTo(map);
        const bounds = L.latLngBounds([[from.lat, from.lng],[to.lat, to.lng]]).pad(0.35);
        map.fitBounds(bounds);

        const dist = haversine(from,to);
        const meta = byId('meta');
        meta.innerHTML = '';
        const el1 = document.createElement('div'); el1.className='pill'; el1.textContent = `Distance: ${km(dist)} km`;
        const el2 = document.createElement('div'); el2.className='pill'; el2.textContent = `From: ${fmtCoord(from)}`;
        const el3 = document.createElement('div'); el3.className='pill'; el3.textContent = `To: ${fmtCoord(to)}`;
        meta.append(el1, el2, el3);

        return setParams({from,to,message,fromName,toName});
      }

      byId('update').addEventListener('click', ()=>{
        const from = parseLatLng(byId('from').value);
        const to = parseLatLng(byId('to').value);
        const message = byId('message').value;
        const fromName = byId('fromLabel').textContent;
        const toName = byId('toLabel').textContent;
        if(!from||!to) return alert('Use the format: lat,lng');
        const url = setParams({from,to,message,fromName,toName});
        render();
      });

      byId('share').addEventListener('click', async ()=>{
        try{
          await navigator.clipboard.writeText(location.href);
          alert('URL copied! You can make a QR code with it.');
        }catch(e){
          prompt('Copy this URL:', location.href);
        }
      });

      // allow quick renaming via double‑click on labels
      function makeEditable(spanId){
        const el = byId(spanId);
        el.style.cursor='text';
        el.title='Double‑click to edit name';
        el.addEventListener('dblclick', ()=>{
          const v = prompt('Type a nicer place name for display:', el.textContent);
          if(v){ el.textContent = v; render(); }
        });
      }
      makeEditable('fromLabel');
      makeEditable('toLabel');

      render();
    </script>
  </body>
</html>
